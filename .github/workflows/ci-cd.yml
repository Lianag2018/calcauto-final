name: CI/CD CalcAuto

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Une seule exécution à la fois par branche : deux fusions rapprochées dans main
# se mettent en ligne l'une après l'autre, la plus récente en dernier. Sans cela,
# la mise en ligne la plus ancienne pouvait finir après l'autre et la remplacer.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pytest pdfplumber pandas openpyxl

      - name: Run unit tests
        run: pytest tests/test_ci_unit.py tests/test_codes_par_annee.py tests/test_soumission_pdf_courriel.py tests/test_suivis_2_7_30.py -v --tb=short

      - name: Run post-import validation tests
        run: pytest tests/test_post_import.py -v --tb=short

  deploy-render:
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-vercel:
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install latest Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
